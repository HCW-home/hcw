name: Rollback

# Re-points the moving `production` image tags at an already published
# immutable tag, then redeploys through Coolify. Nothing is rebuilt: the old
# image is copied from its existing registry manifest, so the Oracle server
# still only pulls.
#
# Database migrations are NOT rolled back. Deploying an older application
# image against a migrated database is only safe when the change is backwards
# compatible; see docs/CICD-COOLIFY-DEPLOYMENT.md ("Rollback").

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Immutable tag to restore, e.g. sha-<40 character commit sha>'
        required: true
        type: string
      scope:
        description: Which stack to roll back
        required: true
        type: choice
        options: [hcw, waruwenjo, both]
        default: hcw
      deploy:
        description: Redeploy through Coolify after moving the tags
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

# Same group as the release workflow: a rollback can never overlap a release.
concurrency:
  group: production-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  rollback:
    name: Restore ${{ inputs.image_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image list
        id: resolve
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          case "$SCOPE" in
            hcw) images="hcw6-backend hcw6-admin hcw6-patient hcw6-practitioner" ;;
            waruwenjo) images="hcw6-waruwenjo" ;;
            both) images="hcw6-backend hcw6-admin hcw6-patient hcw6-practitioner hcw6-waruwenjo" ;;
            *) echo "::error::unknown scope: $SCOPE"; exit 1 ;;
          esac
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "namespace=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the requested tag exists and is linux/arm64
        env:
          NAMESPACE: ${{ steps.resolve.outputs.namespace }}
          TAG: ${{ inputs.image_tag }}
          IMAGES: ${{ steps.resolve.outputs.images }}
        run: |
          set -euo pipefail
          for image in $IMAGES; do
            bash ./scripts/ci/verify-arm64.sh "${REGISTRY}/${NAMESPACE}/${image}:${TAG}"
          done

      - name: Move production tags back to ${{ inputs.image_tag }}
        env:
          NAMESPACE: ${{ steps.resolve.outputs.namespace }}
          TAG: ${{ inputs.image_tag }}
          IMAGES: ${{ steps.resolve.outputs.images }}
        run: bash ./scripts/ci/promote-images.sh

      - name: Redeploy HCW through Coolify
        if: inputs.deploy && (inputs.scope == 'hcw' || inputs.scope == 'both')
        env:
          COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_SERVICE_UUID: ${{ secrets.COOLIFY_HCW_SERVICE_UUID }}
        run: bash ./scripts/ci/coolify-deploy.sh "HCW rollback"

      - name: Verify HCW health
        if: inputs.deploy && (inputs.scope == 'hcw' || inputs.scope == 'both')
        env:
          HEALTHCHECK_URLS: ${{ secrets.HCW_HEALTHCHECK_URLS }}
        run: bash ./scripts/ci/health-check.sh

      - name: Redeploy WaruWenJo through Coolify
        if: inputs.deploy && (inputs.scope == 'waruwenjo' || inputs.scope == 'both')
        env:
          COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_SERVICE_UUID: ${{ secrets.COOLIFY_WARUWENJO_SERVICE_UUID }}
        run: bash ./scripts/ci/coolify-deploy.sh "WaruWenJo rollback"

      - name: Verify WaruWenJo health
        if: inputs.deploy && (inputs.scope == 'waruwenjo' || inputs.scope == 'both')
        env:
          HEALTHCHECK_URLS: ${{ secrets.WARUWENJO_HEALTHCHECK_URLS }}
        run: bash ./scripts/ci/health-check.sh

      - name: Summary
        if: always()
        env:
          TAG: ${{ inputs.image_tag }}
          SCOPE: ${{ inputs.scope }}
          IMAGES: ${{ steps.resolve.outputs.images }}
        run: |
          {
            echo "### Rollback to \`${TAG}\`"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Images restored | ${IMAGES} |"
            echo "| Scope | ${SCOPE} |"
            echo "| Database | untouched (migrations are not rolled back) |"
          } >> "$GITHUB_STEP_SUMMARY"
