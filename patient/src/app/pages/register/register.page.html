<ion-content class="register-content" [scrollY]="false">
  <div class="auth-card">
    <app-auth-branding />
    <div class="right-side">
      <div class="right-content">
        <h2>{{ 'register.title' | translate }}</h2>
        <p class="subtitle">{{ 'register.subtitle' | translate }}</p>

        @if (loading) { } @else if (!registrationEnabled) {
        <div class="disabled-container">
          <ion-icon
            name="close-circle-outline"
            color="medium"
            class="disabled-icon"
          ></ion-icon>
          <p>{{ 'register.registrationDisabled' | translate }}</p>
        </div>
        } @else {
        <app-auth-form
          mode="register"
          (authenticated)="onAuthenticated()"
          (modeChange)="goToLogin()">
        </app-auth-form>
        }

        <app-language-selector></app-language-selector>
      </div>
    </div>
  </div>
</ion-content>
