<ion-content class="login-content" [scrollY]="false">
  <div class="auth-card">
    <app-auth-branding />
    <div class="right-side">
      <div class="right-content">
        <h2>{{ 'login.title' | translate }}</h2>
        <p class="subtitle">{{ 'login.subtitle' | translate }}</p>

        <app-auth-form
          mode="login"
          [initialIdentifier]="initialIdentifier"
          [autoContinue]="skipEmailStep"
          (authenticated)="navigateAfterAuth()"
          (modeChange)="goToRegister()"
          (forgotPassword)="forgotPassword($event)">
        </app-auth-form>

        <app-language-selector></app-language-selector>

        @if (isNative && activeHost) {
          <div class="server-switch">
            <ion-text color="medium" class="server-host">
              {{ 'instancePicker.currentServer' | translate: { host: activeHost } }}
            </ion-text>
            <ion-text color="primary" (click)="changeServer()" class="link-text">
              {{ 'instancePicker.changeServer' | translate }}
            </ion-text>
          </div>
        }

        @if (showDeeplinkBanner) {
          <div class="open-in-app-banner">
            <span>{{ 'home.openInAppPrompt' | translate }}</span>
            <button class="card-btn card-btn-outline" (click)="openInApp()">
              {{ 'home.openInApp' | translate }}
            </button>
          </div>
        }
      </div>
    </div>
  </div>
</ion-content>
