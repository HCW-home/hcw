@if (incomingCall) {
  <!-- alertdialog, not dialog: an incoming call takes over the screen and
       needs announcing the moment it appears. Labelled by the caller name and
       described by the "is calling" line, so a screen reader reads both. -->
  <div class="incoming-call-overlay">
    <div class="incoming-call-container" role="alertdialog" aria-modal="true"
         aria-labelledby="incoming-call-name" aria-describedby="incoming-call-label">
      <div class="caller-info">
        <div class="avatar-wrapper">
          <div class="pulse-ring"></div>
          <div class="pulse-ring pulse-ring--delayed"></div>
          @if (incomingCall.callerPicture) {
            <ion-avatar class="avatar">
              <img [src]="incomingCall.callerPicture" [alt]="incomingCall.callerName" />
            </ion-avatar>
          } @else {
            <div class="avatar avatar--placeholder">
              {{ getInitials(incomingCall.callerName) }}
            </div>
          }
        </div>
        <h2 class="caller-name" id="incoming-call-name">{{ incomingCall.callerName }}</h2>
        <p class="call-label" id="incoming-call-label">{{ 'incomingCall.isCalling' | translate }}</p>
      </div>
      <div class="actions">
        <ion-button
          #acceptButton
          class="action-button action-button--accept"
          (click)="onAccept()"
          color="success"
          shape="round"
        >
          <ion-icon slot="start" name="call-outline" aria-hidden="true"></ion-icon>
          {{ 'incomingCall.accept' | translate }}
        </ion-button>
        <ion-button
          class="action-button action-button--decline"
          (click)="onDecline()"
          color="danger"
          shape="round"
        >
          <ion-icon slot="start" name="close-outline" aria-hidden="true"></ion-icon>
          {{ 'incomingCall.later' | translate }}
        </ion-button>
      </div>
    </div>
  </div>
}
