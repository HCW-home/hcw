<app-modal
  [isOpen]="isOpen"
  size="large"
  [showCloseButton]="false"
  [bodyPadding]="false"
  (closed)="onClose()">
  <div class="slot-modal-content">
    <div class="slot-modal-header">
      <app-typography [variant]="TypographyTypeEnum['body-l-semibold']">
        {{ modalTitle }}
      </app-typography>
      <app-button
        leftIcon="close"
        [size]="ButtonSizeEnum.small"
        [style]="ButtonStyleEnum.text"
        (buttonClick)="onClose()">
      </app-button>
    </div>

    <form [formGroup]="slotForm" (ngSubmit)="save()" class="slot-modal-form">
      <div class="form-section">
        <app-typography
          [variant]="TypographyTypeEnum['body-l-semibold']"
          color="var(--slate-700)">
          {{ 'slotModal.timeSettings' | translate }}
        </app-typography>

        <div class="time-inputs">
          <div class="form-field">
            <app-input
              [label]="'slotModal.startTime' | translate"
              type="time"
              formControlName="start_time"
              [invalid]="isFieldInvalid('start_time')"
              [invalidMessage]="getFieldError('start_time')"
              leftIcon="clock">
            </app-input>
          </div>

          <div class="form-field">
            <app-input
              [label]="'slotModal.endTime' | translate"
              type="time"
              formControlName="end_time"
              [invalid]="isFieldInvalid('end_time')"
              [invalidMessage]="getFieldError('end_time')"
              leftIcon="clock">
            </app-input>
          </div>
        </div>

        <div class="time-inputs">
          <div class="form-field">
            <app-input
              [label]="'slotModal.breakStart' | translate"
              type="time"
              formControlName="start_break"
              leftIcon="pause">
            </app-input>
          </div>

          <div class="form-field">
            <app-input
              [label]="'slotModal.breakEnd' | translate"
              type="time"
              formControlName="end_break"
              leftIcon="pause">
            </app-input>
          </div>
        </div>
      </div>

      <div class="form-section">
        <app-typography
          [variant]="TypographyTypeEnum['body-l-semibold']"
          color="var(--slate-700)">
          {{ 'slotModal.workingDays' | translate }}
        </app-typography>

        <div class="days-grid">
          @for (day of weekDays; track day.key) {
            <div class="day-item">
              <app-switch
                [formControlName]="day.key"
                [label]="day.short | translate">
              </app-switch>
            </div>
          }
        </div>
      </div>

      <div class="form-section">
        <app-typography
          [variant]="TypographyTypeEnum['body-l-semibold']"
          color="var(--slate-700)">
          {{ 'slotModal.validityPeriod' | translate }}
        </app-typography>

        <div class="form-field">
          <app-input
            [label]="'slotModal.validUntil' | translate"
            type="date"
            formControlName="valid_until"
            [placeholder]="'slotModal.validUntilPlaceholder' | translate"
            leftIcon="calendar">
          </app-input>
        </div>
      </div>

      <div class="slot-modal-actions">
        @if (isEditing) {
          <app-button
            class="delete-action"
            [text]="'slotModal.deleteSlot' | translate"
            leftIcon="trash"
            [size]="ButtonSizeEnum.medium"
            [style]="ButtonStyleEnum.stroke"
            [state]="ButtonStateEnum.error"
            (buttonClick)="confirmDelete()">
          </app-button>
        }

        <app-button
          [text]="'slotModal.cancel' | translate"
          [size]="ButtonSizeEnum.medium"
          [style]="ButtonStyleEnum.stroke"
          (buttonClick)="onClose()">
        </app-button>

        <app-button
          [text]="isEditing ? ('slotModal.updateSlot' | translate) : ('slotModal.createSlot' | translate)"
          [leftIcon]="isEditing ? 'check' : 'plus'"
          [size]="ButtonSizeEnum.medium"
          [style]="ButtonStyleEnum.primary"
          [disabled]="isSaving()"
          [loading]="isSaving()"
          (buttonClick)="save()">
        </app-button>
      </div>
    </form>
  </div>
</app-modal>
