<app-modal
  [isOpen]="isOpen"
  [title]="'appointmentForm.addParticipant' | translate"
  size="medium"
  (closed)="onClose()">
  @if (isOpen) {
  <div class="add-participant-form">
    <app-contact-picker
      #participantPickerRef
      [label]="'appointmentForm.participantLabel' | translate"
      [meUser]="currentUser"
      [showVisibility]="true"
      [highlightSearch]="highlightExternalGuest"
      [highlightDetails]="highlightExternalEmail"
      [highlightVisibility]="highlightVisibleCheckbox"
      (selectionChange)="onSelectionChange($event)">
    </app-contact-picker>
  </div>
  }

  <div modal-footer class="add-participant-modal-footer">
    <app-button
      [text]="'appointmentForm.cancelLabel' | translate"
      [style]="ButtonStyleEnum.stroke"
      [size]="ButtonSizeEnum.medium"
      (buttonClick)="onClose()">
    </app-button>
    <div
      class="add-participant-submit-wrapper"
      [class.wizard-highlight-target]="highlightSubmit">
      <app-button
        [text]="'appointmentForm.addTheParticipant' | translate"
        leftIcon="plus"
        [style]="ButtonStyleEnum.primary"
        [size]="ButtonSizeEnum.medium"
        [disabled]="!hasSelection() || isSubmitting || disableSubmit"
        [loading]="isSubmitting"
        (buttonClick)="addParticipant()">
      </app-button>
    </div>
  </div>
</app-modal>
