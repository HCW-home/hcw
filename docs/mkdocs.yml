site_name: HCW@Home v6 documentation
site_description: Documentation for HCW@Home V6 teleconsultation platform
site_url: https://hcw-at-home.com/docs

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: white
      accent: teal
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

plugins:
  - search
  - redirects:
      redirect_maps:
        # Anciennes URLs servies sous une base /docs/ — voir Search Console
        'docs/admin/advanced-options.md': 'admin/advanced-options.md'
        'docs/admin/encryption.md': 'admin/encryption.md'
        'docs/admin/fhir.md': 'admin/fhir.md'
        'docs/admin/media-servers.md': 'admin/media-servers.md'
